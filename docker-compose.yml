services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: quizify
    ports:
      - "3308:3306"
    volumes:
      - quizify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./quizify-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:@mysql:3306/quizify
    volumes:
      - ./quizify-backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./quizify-backend/.env

  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend

volumes:
  quizify_mysql_data:
